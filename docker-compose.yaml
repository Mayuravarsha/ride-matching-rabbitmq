services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"       # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  producer:
    build: .
    ports:
      - "8484:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 20
    restart: on-failure

  matcher:
    build: .
    command: ["python", "-m", "ridematch.matcher"]
    environment:
      PRODUCER_ADDRESS: producer:5000
      RIDE_TIME_SCALE: "1"
    depends_on:
      producer:
        condition: service_healthy
    deploy:
      replicas: 3           # scale with: docker compose up --scale matcher=N
    restart: on-failure

  db_writer:
    build: .
    command: ["python", "-m", "ridematch.db_writer"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: on-failure
